name: Test
on:
  push:
    # branch pushes only excludes tag pushes so release/prerelease workflows
    # don't trigger this a second time via their own tag-push + workflow_call
    branches:
      - "**"
  workflow_call:

jobs:
  test:
    name: Run tests
    runs-on: self-hosted
    container: rust:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run tests
        run: cargo test --workspace
