[package]
name = "open-eye"
version = "0.1.1"
description = "Metrics collection library for the Observe server monitoring application"
repository = "https://github.com/ObServe-Your-Server/observer/tree/standalone/crates/open-eye"
edition = "2021"
keywords = ["observe", "system", "metrics", "cpu", "memory"]
documentation = "https://docs.rs/open-eye"
homepage = "https://observe.vision"
readme = "README.md"
authors = ["Marco Brandt mail@marco-brandt.com"]
license-file = "../../LICENSE"


[lib]
name = "open_eye"
path = "src/lib.rs"

[dependencies]
log = "0.4.30"
env_logger = "0.11.10"
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1"
sysinfo = "0.39.5"
tokio = { version = "1.52.3", features = ["full"] }
docker-api = "0.14.0"
futures-util = "0.3.32"
nix = { version = "0.31.3", features = ["fs", "user"] }
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json", "http2"], default-features = false }
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0.103"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
nvml-wrapper = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_System_Performance", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
