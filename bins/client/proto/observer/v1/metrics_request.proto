syntax = "proto3";

package observer.v1;

import "observer/v1/metrics/container_runtime.proto";
import "observer/v1/metrics/cpu.proto";
import "observer/v1/metrics/error_stats.proto";
import "observer/v1/metrics/partition.proto";
import "observer/v1/metrics/memory.proto";
import "observer/v1/metrics/network.proto";
import "observer/v1/metrics/process.proto";
import "observer/v1/metrics/speedtest.proto";
import "observer/v1/metrics/system.proto";
import "observer/v1/metrics/tunnel_access_log.proto";

// Requests every available metric at once.
message FullRequest {}

message TimeRange {
  // Inclusive start of the queried time range, unix timestamp (seconds).
  int64 start = 1;

  // Inclusive end of the queried time range, unix timestamp (seconds).
  int64 end = 2;
}

message MetricsRequest {
  string request_id = 1;

  oneof requested_metric {
    observer.v1.metrics.CpuRequest cpu_request = 2;
    observer.v1.metrics.PartitionRequest partition_request = 3;
    observer.v1.metrics.MemoryRequest memory_request = 4;
    observer.v1.metrics.NetworkRequest network_request = 5;
    observer.v1.metrics.ProcessRequest process_request = 6;
    observer.v1.metrics.SpeedtestRequest speedtest_request = 7;
    observer.v1.metrics.SystemRequest system_request = 8;
    observer.v1.metrics.ContainerRuntimeRequest container_runtime_request = 9;
    observer.v1.metrics.ErrorStatsRequest error_stats_request = 13;
    observer.v1.metrics.TunnelAccessLogRequest tunnel_access_log_request = 14;
    FullRequest full_request = 10;
  }

  oneof query {
    TimeRange range = 11;
    int64 last_n = 12;
  }
}
