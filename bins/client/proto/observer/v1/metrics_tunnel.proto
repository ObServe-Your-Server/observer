syntax = "proto3";

package observer.v1;

import "google/protobuf/empty.proto";
import "observer/v1/metrics_request.proto";
import "observer/v1/metrics_response.proto";
import "observer/v1/metrics/cpu.proto";
import "observer/v1/metrics/container_runtime.proto";
import "observer/v1/metrics/error_stats.proto";
import "observer/v1/metrics/memory.proto";
import "observer/v1/metrics/network.proto";
import "observer/v1/metrics/partition.proto";
import "observer/v1/metrics/process.proto";
import "observer/v1/metrics/speedtest.proto";
import "observer/v1/metrics/system.proto";
import "observer/v1/metrics/tunnel_access_log.proto";

service MetricsTunnel {
  rpc Tunnel(google.protobuf.Empty) returns (stream observer.v1.MetricsRequest);
  rpc MetricsResponse(observer.v1.MetricsResponse) returns (google.protobuf.Empty);
}

