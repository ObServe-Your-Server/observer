syntax = "proto3";

package observer.v1.metrics;

import "observer/v1/time_query.proto";

import "google/protobuf/timestamp.proto";

// request
message NetworkRequest {
  observer.v1.TimeQuery time_query = 1;
}

// response
message NetworkResponse {
  repeated NetworkMetrics items = 1;
}

message NetworkMetrics {
  string local_ip = 1;
  uint64 total_bytes_transmitted = 2;
  uint64 total_bytes_received = 3;
  uint64 total_packets_transmitted = 4;
  uint64 total_packets_received = 5;
  google.protobuf.Timestamp collected_at = 6;
}
