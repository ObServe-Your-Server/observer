syntax = "proto3";

package observer.v1.metrics;

import "google/protobuf/timestamp.proto";

// request
message TunnelAccessLogRequest {}

// response
message TunnelAccessLogResponse {
  repeated TunnelAccessLogMetrics items = 1;
}

message TunnelAccessLogMetrics {
  string sent_data = 1;
  google.protobuf.Timestamp sent_at = 2;
}
