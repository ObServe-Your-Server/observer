syntax = "proto3";

package observer.v1.metrics;

import "google/protobuf/timestamp.proto";

// request
message PartitionRequest{}

// response
message PartitionResponse {
  repeated PartitionEntry items = 1;
}

message PartitionEntry {
  repeated PartitionMetrics partitions = 1;
  google.protobuf.Timestamp collected_at = 2;
}

message PartitionMetrics {
  string name = 1;
  string device = 2;
  string mount_point = 3;
  string fs_type = 4;
  uint64 total_bytes = 5;
  uint64 used_bytes = 6;
  uint64 available_bytes = 7;
  uint64 used_blocks = 8;
  uint64 available_blocks = 9;
  uint64 block_size = 10;
  google.protobuf.Timestamp collected_at = 11;
}
