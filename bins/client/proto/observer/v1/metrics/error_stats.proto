syntax = "proto3";

package observer.v1.metrics;

import "observer/v1/time_query.proto";

import "google/protobuf/timestamp.proto";

// request
message ErrorStatsRequest {
  observer.v1.TimeQuery time_query = 1;
}

// response
message ErrorStatsResponse {
  repeated ErrorStatsMetrics items = 1;
}

message ErrorStatsMetrics {
  optional string file = 1;
  uint64 line = 2;
  optional string severity = 3;
  optional string message = 4;
  google.protobuf.Timestamp collected_at = 5;
}
