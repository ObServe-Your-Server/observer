syntax = "proto3";

package observer.v1.metrics;

import "observer/v1/time_query.proto";

import "google/protobuf/timestamp.proto";

// request
message SpeedtestRequest {
  observer.v1.TimeQuery time_query = 1;
}

// response
message SpeedtestResponse {
  repeated SpeedtestMetrics items = 1;
}

message SpeedtestMetrics {
  double download_mbps = 1;
  double upload_mbps = 2;
  double ping_ms = 3;
  google.protobuf.Timestamp collected_at = 4;
}
