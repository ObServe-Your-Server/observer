syntax = "proto3";

package observer.v1.metrics;

import "google/protobuf/timestamp.proto";

message GpuEntry {
  repeated GpuMetrics gpus = 1;
  google.protobuf.Timestamp collected_at = 2;
}

message GpuMetrics {
  string name = 1;
  optional float usage_percent = 2;
  optional uint64 memory_used_bytes = 3;
  optional uint64 memory_total_bytes = 4;
  optional float temperature_celsius = 5;
  google.protobuf.Timestamp collected_at = 6;
}
